<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <title>{% block title %}Roman Numeral Converter{% endblock %}</title>
</head>
    <body>
        <h1>Roman Numeral Converter</h1>

        <div class="form-container">
            <h2>Convert Number to Roman Numeral</h2>
            <form>
                <input type="number" name="number" placeholder="Enter a number (1-3999)" required>
                <input type="hidden" name="action" value="to_roman">
                <button type="submit">Convert to Roman</button>
            </form>
        </div>

        <div class="form-container">
            <h2>Convert Roman Numeral to Number</h2>
            <form>
                <input type="text" name="roman_number" placeholder="Enter Roman numeral" required>
                <input type="hidden" name="action" value="to_decimal">
                <button type="submit">Convert to Number</button>
            </form>
        </div>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        {% if result %}
            <p class="result">Result: {{ result }}</p>
        {% endif %}
    </body>
</html>
