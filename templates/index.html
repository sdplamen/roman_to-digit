<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roman numeral Converter</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1>Roman numeral Converter</h1>
    <div class="container">
        <div class="converter">
            <h2>Decimal to Roman</h2>
            <form method="get" action="/">
                <input type="hidden" name="action" value="to_roman">
                <input type="number" name="number" placeholder="Enter a number" required>
                <button type="submit">Convert</button>
            </form>
        </div>

        {% if result %}
            <div class="result">
                <h2>Result: {{ result }}</h2>
            </div>
        {% endif %}

        {% if error %}
            <div class="error">
                <h2>Error: {{ error }}</h2>
            </div>
        {% endif %}

        <div class="converter">
            <h2>Roman to Decimal</h2>
            <form method="get" action="/">
                <input type="hidden" name="action" value="to_decimal">
                <input type="text" name="roman_number" placeholder="Enter a Roman numeral" required>
                <button type="submit">Convert</button>
            </form>
        </div>
    </div>
</body>
</html>
